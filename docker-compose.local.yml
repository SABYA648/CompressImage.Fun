# Local developer convenience overlay. Not used by Coolify.
# Publishes web on localhost only so production does not bind 0.0.0.0:8080.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   curl http://127.0.0.1:8080/health

services:
  web:
    ports:
      - '127.0.0.1:${PUBLIC_PORT:-8080}:8080'
